name: bevry
'on':
  - push
  - pull_request
jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install desired Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify Node.js Versions
        run: >-
          printf '%s' 'node: ' && node --version && printf '%s' 'npm: ' && npm
          --version && node -e 'console.log(process.versions)'
      - run: npm run our:setup
      - run: npm run our:compile
      - name: Install targeted Node.js
        if: ${{ matrix.node != 22 }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Verify Node.js Versions
        run: >-
          printf '%s' 'node: ' && node --version && printf '%s' 'npm: ' && npm
          --version && node -e 'console.log(process.versions)'
      # `npm test` generates our `raw.json` and `hydrated.json` artifacts
      - run: npm test
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      # upload those artifacts for the publish job to consume
      - name: Upload generated artifacts for publish consumption
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: json-artifacts
          path: |
            raw.json
            hydrated.json
      # now that those files exist, verification will pass as they can now be imported/verified by our project/linters
      - run: npm run our:verify
  publish:
    if: ${{ github.event_name == 'push' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install desired Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify Node.js Versions
        run: >-
          printf '%s' 'node: ' && node --version && printf '%s' 'npm: ' && npm
          --version && node -e 'console.log(process.versions)'
      - name: Download generated artifacts from test job
        uses: actions/download-artifact@v8
        with:
          name: json-artifacts
      - run: npm run our:setup
      - run: npm run our:compile
      - run: npm run our:meta
      - name: publish to npm
        uses: bevry-actions/npm@v1.1.7
        with:
          npmAuthToken: ${{ secrets.NPM_AUTH_TOKEN }}
          npmBranchTag: ':next'
      - name: publish to surge
        uses: bevry-actions/surge@v1.1.0
        with:
          surgeLogin: ${{ secrets.SURGE_LOGIN }}
          surgeToken: ${{ secrets.SURGE_TOKEN }}
  automerge:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
